<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 下载功能测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .test-section { margin: 20px 0; padding: 20px; background: #2a2a2a; border-radius: 8px; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 5px; }
        button:hover { background: #4338ca; }
        .log { margin-top: 10px; padding: 10px; background: #000; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>
    <h1>HTML 下载功能测试</h1>

    <div class="test-section">
        <h2>测试 1: 基础下载功能</h2>
        <button onclick="testBasicDownload()">测试基础下载</button>
        <div id="log1" class="log"></div>
    </div>

    <div class="test-section">
        <h2>测试 2: extractHtmlContent 函数</h2>
        <button onclick="testExtractHtml()">测试 HTML 提取</button>
        <div id="log2" class="log"></div>
    </div>

    <div class="test-section">
        <h2>测试 3: 模拟实际场景</h2>
        <button onclick="testRealScenario()">模拟完整流程</button>
        <div id="log3" class="log"></div>
    </div>

    <script>
        function log(elementId, message, type = 'info') {
            const logDiv = document.getElementById(elementId);
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function testBasicDownload() {
            const logId = 'log1';
            document.getElementById(logId).innerHTML = '';

            try {
                log(logId, '开始测试基础下载功能...', 'info');

                const htmlContent = `<!DOCTYPE html>
<html>
<head><title>测试页面</title></head>
<body><h1>这是一个测试页面</h1><p>测试内容：中文测试</p></body>
</html>`;

                log(logId, `HTML 内容长度: ${htmlContent.length}`, 'info');

                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                log(logId, `Blob 创建成功, 大小: ${blob.size} bytes`, 'success');

                const url = URL.createObjectURL(blob);
                log(logId, `Blob URL 创建成功: ${url}`, 'success');

                const link = document.createElement('a');
                link.href = url;
                link.download = 'test-download.html';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();

                setTimeout(() => {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    log(logId, '下载触发成功，清理资源', 'success');
                }, 100);

            } catch (error) {
                log(logId, `错误: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function extractHtmlContent(raw) {
            if (!raw) {
                return null;
            }

            // 1. 尝试从 markdown 代码块中提取
            const mdMatch = raw.match(/```(?:html)?\s*\n([\s\S]*?)```/);
            if (mdMatch) {
                const extracted = mdMatch[1].trim();
                if (/<(?:html|body|!doctype)/i.test(extracted)) {
                    return extracted;
                }
            }

            // 2. 尝试查找完整的 HTML 文档
            const htmlMatch = raw.match(/<(!doctype|html)[\s\S]*<\/html>/i);
            if (htmlMatch) {
                return htmlMatch[0];
            }

            // 3. 尝试查找部分 HTML（包含 body）
            const bodyMatch = raw.match(/<body[\s\S]*<\/body>/i);
            if (bodyMatch) {
                return `<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
${bodyMatch[0]}
</html>`;
            }

            return null;
        }

        function testExtractHtml() {
            const logId = 'log2';
            document.getElementById(logId).innerHTML = '';

            // 测试用例 1: 纯 HTML
            const test1 = `<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body><h1>Test</h1></body>
</html>`;

            log(logId, '测试用例 1: 纯 HTML', 'info');
            const result1 = extractHtmlContent(test1);
            log(logId, result1 ? `✓ 提取成功 (${result1.length} chars)` : '✗ 提取失败', result1 ? 'success' : 'error');

            // 测试用例 2: Markdown 包裹的 HTML
            const test2 = `\`\`\`html
<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body><h1>Test</h1></body>
</html>
\`\`\``;

            log(logId, '\n测试用例 2: Markdown 包裹的 HTML', 'info');
            const result2 = extractHtmlContent(test2);
            log(logId, result2 ? `✓ 提取成功 (${result2.length} chars)` : '✗ 提取失败', result2 ? 'success' : 'error');

            // 测试用例 3: 混合文本
            const test3 = `这是一些文本
<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body><h1>Test</h1></body>
</html>
更多文本`;

            log(logId, '\n测试用例 3: 混合文本中的 HTML', 'info');
            const result3 = extractHtmlContent(test3);
            log(logId, result3 ? `✓ 提取成功 (${result3.length} chars)` : '✗ 提取失败', result3 ? 'success' : 'error');
        }

        async function testRealScenario() {
            const logId = 'log3';
            document.getElementById(logId).innerHTML = '';

            try {
                log(logId, '调用真实 API: kai-report-creator...', 'info');

                const response = await fetch('http://localhost:3002/api/v2/skills/kai-report-creator/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        params: {
                            template: 'sales_report',
                            data: { period: '2026-Q1' },
                            format: 'html'
                        }
                    })
                });

                const data = await response.json();
                log(logId, `API 响应: success=${data.success}`, 'info');
                log(logId, `spawnOutput 类型: ${typeof data.spawnOutput}`, 'info');
                log(logId, `spawnOutput 长度: ${data.spawnOutput?.length || 0}`, 'info');

                if (data.success && data.spawnOutput) {
                    const extracted = extractHtmlContent(data.spawnOutput);
                    log(logId, extracted ? `✓ HTML 提取成功 (${extracted.length} chars)` : '✗ HTML 提取失败', extracted ? 'success' : 'error');

                    if (extracted) {
                        // 触发下载
                        const blob = new Blob([extracted], { type: 'text/html;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'real-test.html';
                        link.click();
                        setTimeout(() => URL.revokeObjectURL(url), 100);
                        log(logId, '✓ 下载已触发', 'success');
                    }
                }
            } catch (error) {
                log(logId, `错误: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
