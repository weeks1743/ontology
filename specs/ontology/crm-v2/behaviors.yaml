- code: Lead.Complete
  name: 补全线索信息
  display_name: 补全线索信息
  description: ''
  owner_object: Lead
  owner_object_name: 线索
  trigger_type: USER_ACTION
  trigger_type_label: 用户操作
  required_inputs:
    - budget
    - company
  referenced_rules:
    - Lead.RequiredInfo
    - Lead.BudgetThreshold
  emits_events:
    - lead.completed
  writeback_targets:
    - Lead
- code: Lead.ConvertToOpportunity
  name: 转化为商机
  display_name: 转化为商机
  description: ''
  owner_object: Lead
  owner_object_name: 线索
  trigger_type: USER_ACTION
  trigger_type_label: 用户操作
  inputs:
    - name: budget
      type: number
      required: true
      description: 预算金额
      validation:
        min: 0
        max: 999999999
    - name: company
      type: string
      required: true
      description: 公司名称
      validation:
        min_length: 2
        max_length: 100
    - name: conversion_reason
      type: string
      required: false
      description: 转化原因
  referenced_rules:
    - Lead.RequiredInfo
    - Lead.BudgetThreshold
  emits_events:
    - lead.converted
  writeback_targets:
    - Lead
    - Opportunity
  aliases:
    - 转商机
    - 转成商机
    - 线索转化
    - 创建商机
  nl_examples:
    - 把这个线索转成商机
    - 转化这个潜客
    - 创建商机
    - 线索转商机
  preconditions:
    - rule: Lead.ConvertibleCheck
      failure_action: block
    - rule: Lead.BudgetThreshold
      failure_action: warn
  result_schema:
    - name: opportunity_id
      type: string
      description: 创建的商机ID
    - name: customer_id
      type: string
      description: 创建的客户ID
    - name: contact_id
      type: string
      description: 创建的联系人ID
    - name: success
      type: boolean
      description: 是否成功
  postconditions:
    - type: state_change
      details:
        from: 已评估
        to: 已转化
    - type: event_emitted
      details:
        event: opportunity.created
    - type: creates_object
      details:
        type: Opportunity
        relation: converted_from
    - type: creates_object
      details:
        type: Customer
    - type: creates_object
      details:
        type: Contact
  side_effects:
    - type: modifies
      target: Lead
      fields:
        - status
        - converted_at
    - type: creates
      target: Opportunity
    - type: creates
      target: Customer
    - type: creates
      target: Contact
