      description: 转化来源的线索
- code: Lead
  name: 线索
  display_name: 线索
  description: ''
  lifecycle:
    - state: 新建
      allowed_transitions:
        - 待跟进
        - 已关闭
      required_conditions:
        - Lead.RequiredInfo
      available_behaviors:
        - Lead.Complete
        - Lead.Discard
      on_enter_events: []
      on_exit_events:
        - lead.created
    - state: 待跟进
      allowed_transitions:
        - 跟进中
        - 已关闭
      required_conditions: []
      available_behaviors:
        - Lead.FollowUp
        - Lead.Discard
      on_enter_events:
        - lead.completed
      on_exit_events: []
    - state: 跟进中
      allowed_transitions:
        - 已评估
        - 已关闭
      required_conditions: []
      available_behaviors:
        - Lead.Evaluate
        - Lead.Discard
      on_enter_events: []
      on_exit_events: []
    - state: 已评估
      allowed_transitions:
        - 已转化
        - 已关闭
      required_conditions:
        - Lead.BudgetThreshold
        - Lead.DecisionMaker
      available_behaviors:
        - Lead.ConvertToOpportunity
        - Lead.Reject
      on_enter_events:
        - lead.evaluated
      on_exit_events: []
    - state: 已转化
      allowed_transitions: []
      required_conditions: []
      available_behaviors: []
      on_enter_events:
        - lead.converted
      on_exit_events: []
    - state: 已关闭
      allowed_transitions: []
      required_conditions: []
      available_behaviors: []
      on_enter_events: []
      on_exit_events: []
  attributes:
    - name: title
      display_name: 线索标题
      type: string
      description: 线索标题
      required: true
    - name: source
      display_name: 线索来源
      type: enum
      description: 线索来源
      required: false
      enum_values:
        - 官网
        - 展会
        - 推荐
        - 广告
        - 电话
    - name: budget
      display_name: 预算金额
      type: number
      description: 预算金额
      required: false
    - name: status
      display_name: 当前状态
      type: enum
      description: 当前状态
      required: false
      enum_values:
        - 新建
        - 待跟进
        - 跟进中
        - 已评估
        - 已转化
        - 已关闭
    - name: owner
      display_name: 负责人
      type: string
      description: 负责人
      required: false
    - name: phone
      display_name: 联系电话
      type: string
      description: 联系电话
      required: false
    - name: company
      display_name: 所属公司
      type: string
      description: 所属公司
      required: false
  relations:
    - name: relatedCustomer
      display_name: 关联客户
      target_object: Customer
      type: many-to-one
      description: 关联的已有客户
    - name: relatedContact
      display_name: 关联联系人
      target_object: Contact
      type: many-to-one
      description: 关联的已有联系人
    - name: convertsToOpportunity
      display_name: 转化为商机
      target_object: Opportunity
      type: one-to-many
      description: 转化生成的商机
  aliases:
    - 潜客
    - 销售线索
    - 意向客户
  nl_examples:
    - 创建一个新线索
    - 这个潜客的预算是多少
    - 把这个销售线索转成商机
    - 线索的来源是什么
  negative_examples:
    - 客户
    - 联系人
  disambiguation_notes: 线索是尚未转化的潜在客户，与已转化的"客户"(Customer)不同
