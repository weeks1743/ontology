- code: opportunity.advanced
  name: 商机已推进
  display_name: 商机已推进
  description: ''
  producer_object: Opportunity
  producer_object_name: 商机
  producer_behavior: Opportunity.Advance
  producer_behavior_name: 推进商机
  subscribers:
    - Opportunity.CreateQuote
  impacted_objects:
    - Opportunity
- code: opportunity.created
  name: 商机已创建
  display_name: 商机已创建
  description: ''
  producer_object: Opportunity
  producer_object_name: 商机
  producer_behavior: Opportunity.Create
  producer_behavior_name: 创建商机
  subscribers:
    - Opportunity.Advance
  impacted_objects:
    - Opportunity
  payload_schema:
    - name: lead_id
      type: string
      required: true
      description: 线索ID
    - name: opportunity_id
      type: string
      required: true
      description: 商机ID
    - name: customer_id
      type: string
      required: true
      description: 客户ID
    - name: contact_id
      type: string
      required: true
      description: 联系人ID
    - name: conversion_timestamp
      type: datetime
      required: true
      description: 转化时间
  propagation_conditions:
    - condition: opportunity.status == 'active'
      action: propagate
    - condition: opportunity.status == 'cancelled'
      action: skip
  triggered_behaviors:
    - Activity.LogFollowUp
  trace_policy:
    retention_days: 90
    include_payload: true
    trace_upstream: true
  causality:
    triggers_after:
      - lead.completed
    blocks_until: []
    triggers:
      - activity.logged
